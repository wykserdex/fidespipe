format_version: "0.2"
pipeline:
  name: username_full
  # Платное досье по нику: два независимых источника.
  #   sherlock — своя база (~480 сайтов), метод «профиль по URL существует/нет»;
  #   maigret  — своя база, тот же метод, но другие сайты и бонусом он забирает
  #              данные со страницы профиля (имя, локация, био, аватар).
  # Измерено на реальном прогоне: sherlock ~80 c, maigret ~25 c.
  # holehe отсюда убран: у него CLI принимает email или телефон, голое имя он
  # не проверяет и CSV не пишет (шаг падал в skip с «holehe не дал CSV»).
  # Источник, который заведомо ошибается, в платном отчёте не нужен.
  network: allow
  input:
    username: "example"     # бот подставляет через --input=username=...
  steps:
    - id: sherlock
      plugin: plugins/community/sherlock
      # Платный отчёт не должен умирать из-за одного источника: шаг skip,
      # а отчёт явно пишет, какой источник не отработал и почему. Это часть
      # продукта, а не скрытая деградация — журнал и отчёт показывают одно и то же.
      on_error: skip
      timeout: 700s
    - id: maigret
      plugin: plugins/community/maigret
      # Без sites maigret идёт по всей своей базе. Внутренний лимит плагина —
      # 300 с (default), поэтому шаг даёт ему 330 с: пусть плагин сам честно
      # вернёт «таймаут», а не будет убит движком посреди проверки.
      on_error: skip
      timeout: 330s
