id: phone_check
version: 0.1.0
platform_api: "^0.1"
description: "Любой формат телефона → E.164 (+375 (29) 123-45-67 → +375291234567)"
author: "community · fidespipe showcase"

runtime:
  type: python
  entry: main.py
  requires: []

input:
  phone:
    from: input.phone
    type: string
    format: text
  default_country:
    from: input.default_country
    type: string
    optional: true

output:
  normalized: { type: string }
  valid:      { type: boolean }
  country:    { type: string }

permissions:
  network: []
  filesystem: none
  secrets: []
