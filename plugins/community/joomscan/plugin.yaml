id: joomscan
version: 0.1.0
platform_api: "^0.1"
description: >
  OWASP JoomScan — неинвазивный аудит Joomla-сайта: версия, известные уязвимости
  и ошибки конфигурации, перечисление компонентов. Обёртка над CLI joomscan: одна
  явно заданная цель, текстовый репорт reports/<host>/<host>_report_*.txt
  разбирается в версию, находки и компоненты (каталог reports/ плагин создаёт
  сам: mkdir в report.pl не рекурсивный). JoomScan — инструмент на Perl,
  JoomScan — инструмент на Perl: донор объявлен в манифесте и ставится вместе
  с плагином (OWASP/joomscan, закреплённый коммит, проверка sha256). Нужен
  интерпретатор perl.
author: "community · fidespipe showcase (web security)"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib; донор объявлен ниже
  donor:
    kind: binary
    name: joomscan
    version: "2ea8cc7"
    url: https://github.com/OWASP/joomscan/archive/2ea8cc7792b3893b80a52e4ad7cc32a1a9dbf7fc.tar.gz
    sha256: 725c01811f558b71242457e90facbad5914a5cfb72681cd93346477a382580ab
    target: joomscan.pl
    bin_env: JOOMSCAN_BIN

input:
  url:
    from: input.url
    type: string
    format: url         # единственная цель: её задаёт оператор
  components:
    from: input.components
    type: boolean
    optional: true      # --enumerate-components/-ec, перебор расширений (default false)
  timeout:
    from: input.timeout
    type: number
    optional: true      # --timeout, таймаут HTTP-запроса, секунды (у joomscan 60)
  wall_timeout:
    from: input.wall_timeout
    type: number
    optional: true      # общий лимит рана, секунды (default 300)

output:
  url:        { type: string }
  version:    { type: string }
  vulns:      { type: array }
  components: { type: array }
  count:      { type: number }

permissions:
  network: [ { any_host: true, port: 443 }, { any_host: true, port: 80 } ]
  filesystem: none
  secrets: []