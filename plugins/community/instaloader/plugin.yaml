id: instaloader
version: 0.1.0
platform_api: "^0.1"
description: >
  Instaloader (instaloader/instaloader) — метаданные публичного профиля
  Instagram, без скачивания медиа и без логина. CLI instaloader не умеет
  печатать метаданные профиля в stdout (флага --json нет, --no-login нет),
  поэтому обёртка идёт паттерном C: запускает тот же интерпретатор с
  фиксированным сниппетом, который читает профиль публичным API
  (Profile.from_username, анонимно) и печатает JSON. Сниппет читает только
  нужные выходу свойства Profile (username, full_name, followers, followees,
  mediacount, is_private). Загрузка картинок/видео и запись метаданных в
  файлы выключены (соответствуют флагам --no-pictures, --no-videos,
  --no-video-thumbnails, --no-metadata-json).
  Инструмент ставится отдельно: pip install instaloader.
author: "community · fidespipe showcase (OSINT)"

runtime:
  type: python
  entry: main.py
  requires: [instaloader==4.15.4]  # донор объявлен: ставится вместе с плагином, отдельно не нужен

input:
  profile:
    from: input.profile
    type: string
    format: text        # имя публичного профиля Instagram без @
  wall_timeout:
    from: input.wall_timeout
    type: number
    optional: true       # общий лимит рана, секунды (default 300)

output:
  profile:    { type: string }   # как передан на входе
  username:   { type: string }   # username из ответа Instagram
  followers:  { type: number }   # подписчики; у закрытого профиля без логина 0
  posts:      { type: number }   # число публикаций (mediacount)
  is_private: { type: boolean }
  full_name:  { type: string }

permissions:
  network: [ { any_host: true, port: 443, note: "target: api.instagram.com:443 (публичный запрос профиля, без логина); точечный egress не enforce'ится, поэтому заявлен весь интернет" } ]
  filesystem: none
  secrets: []
