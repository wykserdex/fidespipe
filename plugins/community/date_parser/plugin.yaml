id: date_parser
version: 0.1.1
platform_api: "^0.1"
description: "Даты ru/en → проверенный ISO 8601; неоднозначный числовой формат требует lang"
author: "community · fidespipe showcase"

runtime:
  type: python
  entry: main.py
  requires: []

input:
  text:
    from: input.text
    type: string
    format: text
  lang:
    from: input.lang
    type: string
    optional: true

output:
  iso:      { type: string }
  parsed:   { type: boolean }
  format:   { type: string }

permissions:
  network: []
  filesystem: none
  secrets: []
