id: ghauri
version: 0.1.0
platform_api: "^0.1"
description: >
  Ghauri (r0oth3x49) — детектор SQL-инъекций на Python, наследник sqlmap.
  Обёртка над CLI ghauri: гоняет неинвазивный аудит (уровень 1, только
  GET/POST-параметры) по явно заданному пользователем URL и разбирает его
  отчёт: вывод процесса (stderr) и лог ~/.ghauri/<host>/log. Флаги перечисления
  и эксплуатации (--dbs/--tables/--dump/--sql-shell) плагин не передаёт никогда.
  Ghauri — Go-программа: донор объявлен в манифесте и ставится вместе с
  плагином (go install github.com/r0oth3x49/ghauri/cmd/ghauri@v1.0.5).
author: "community · wedra showcase (vuln)"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib; донор объявлен ниже (на PyPI пакета нет)
  donor:
    kind: go
    name: ghauri
    version: v1.0.5
    module: github.com/r0oth3x49/ghauri/cmd/ghauri
    bin_env: GHAURI_BIN

input:
  url:
    from: input.url
    type: string
    format: url         # ровно одна цель, заданная пользователем
  timeout:
    from: input.timeout
    type: number
    optional: true      # таймаут на HTTP-запрос к цели, секунды (default 30)
  wall_timeout:
    from: input.wall_timeout
    type: number
    optional: true      # общий лимит рана, секунды (default 600)

output:
  url:         { type: string }
  vulnerable:  { type: boolean }
  parameter:   { type: string }
  injections:  { type: array }

permissions:
  network: [ { any_host: true, port: 443 }, { any_host: true, port: 80 } ]
  filesystem: none
  secrets: []