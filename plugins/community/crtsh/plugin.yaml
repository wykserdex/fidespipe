id: crtsh
version: 0.1.0
platform_api: "^0.1"
description: >
  crt.sh (Certificate Transparency) — сертификаты по домену. Чистый HTTP
  (stdlib, без зависимостей): GET https://crt.sh/?q=%25.<domain>&output=json →
  имена (CN+SAN), issuers, просроченные. Выход агрегированный (реестр может
  вернуть тысячи записей — сырьё не тащим).
author: "community · fidespipe showcase (OSINT)"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib

input:
  domain:
    from: input.domain
    type: string
    format: text
  timeout:
    from: input.timeout
    type: number
    optional: true      # HTTP-таймаут, секунды (default 30)

output:
  domain:    { type: string }
  total:     { type: number }
  names:     { type: array }
  issuers:   { type: array }
  expired:   { type: number }

permissions:
  # Цель — crt.sh:443, но точечный egress-фильтр по host:port не реализован ни
  # на одной платформе, поэтому список хостов был бы ограничением только
  # на бумаге: рантайм всё равно выдаёт полный доступ. Запрашиваем его явно,
  # с настоящей целью в note — иначе объявление вводит в заблуждение.
  network: [ { any_host: true, port: 443, note: "target: crt.sh:443; per-host egress is not enforced yet, so blanket egress is requested explicitly" } ]
  filesystem: none
  secrets: []
