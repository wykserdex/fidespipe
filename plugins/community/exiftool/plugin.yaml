id: exiftool
version: 0.1.0
platform_api: "^0.1"
description: >
  ExifTool (Phil Harvey) — чтение метаданных файлов: EXIF/IPTC/XMP, модель
  устройства, GPS, даты съёмки. Обёртка над CLI exiftool (`-j` печатает JSON в
  stdout). Донор объявлен в манифесте и ставится вместе с плагином: официальный
  Image-ExifTool 13.59 с проверкой sha256. Нужен интерпретатор perl.
author: "community · fidespipe showcase (OSINT)"

runtime:
  type: python
  entry: main.py
  requires: []          # только stdlib; донор объявлен ниже
  donor:
    kind: binary
    name: exiftool
    version: "13.59"
    url: https://sourceforge.net/projects/exiftool/files/Image-ExifTool-13.59.tar.gz/download
    sha256: 668ea3acececb7235fbd0f4900e72d5f12c9b07e5c778fd36cb1e9b5828fd65a
    target: exiftool
    bin_env: EXIFTOOL_BIN

input:
  file:
    from: input.file
    type: string
    format: file_ref # путь к файлу на диске
  wall_timeout:
    from: input.wall_timeout
    type: number
    optional: true      # общий лимит рана, секунды (default 60)

output:
  file:  { type: string }
  tags:  { type: object }
  count: { type: number }

permissions:
  network: []           # ExifTool работает по файлу, сети не касается
  filesystem: read      # читает файл, переданный вызывающим
  secrets: []