name: pages
on:
  push:
    branches: [main]
    paths:
      - 'cmd/fidespipewasm/**'
      - 'web/demo/**'
      - 'internal/**'
      - 'go.mod'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10' # та же планка, что в ci.yml: минимум из go.mod
      # build.sh кладёт fidespipe.wasm и wasm_exec.js рядом со страницей, и
      # артефактом уезжает web/demo как есть: без бандлера и упаковки. Оба
      # файла в .gitignore — байты на Pages собирает CI, а не репозиторий.
      - name: build the wasm engine into web/demo
        run: web/demo/build.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
