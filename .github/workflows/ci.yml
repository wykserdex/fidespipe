name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      # Полная история нужна шагу `fidespipe check`: registry validate сверяет
      # commit-пины с историей («пин является предком HEAD»). На мелкой копии
      # actions/checkout по умолчанию (depth 1) этих коммитов нет, и проверка
      # падает как «Not a valid commit name» — то есть supply-chain проверка
      # не выполняется вовсе. 180 коммитов, ~5 МБ — дешевле, чем потеря шага.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10' # GO-2026-6809: crypto/x509, чинится в 1.26.10
      - name: version invariants
        run: |
          set -eu
          product_version=$(tr -d '\r\n' < VERSION)
          grep -Fq "## ${product_version} " CHANGELOG.md
          protocol_version=$(tr -d '\r\n' < protocol/VERSION)
          grep -Fq "## v${protocol_version} " protocol/CHANGELOG.md
          grep -Fq "\"protocol\": \"${protocol_version}\"" conformance/manifest.json
          test -z "$(git ls-files var/runs)"
      # Внутренние заметки (переписка по аутричу, инструкции агента, исторические
      # разборы, некомпилируемый архив кода) не публикуются. Проверка стоит здесь,
      # потому что цена ошибки — не сломанная сборка, а опубликованный документ,
      # который читают раньше кода. Разбор — docs/repo-hygiene.md.
      - name: internal notes stay out of the public tree
        run: |
          set -eu
          for p in AGENTS.md OUTREACH_TRACKER.md OUTREACH_ROUND2.md archive attic; do
            if git ls-files --error-unmatch "$p" >/dev/null 2>&1; then
              echo "внутренний путь $p попал в индекс: ему здесь не место (docs/repo-hygiene.md)" >&2
              exit 1
            fi
          done
      - name: vulnerability scan
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: workflow lint
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$RUNNER_TEMP/bin/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - name: install sandbox backend (bubblewrap)
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
      # Встроенный allow-list (internal/plugin/trustseed_gen.go) засеян из
      # пинов registry.yaml. Если пин сдвинули, а seed не перегенерировали,
      # доверенным окажется не тот байт-в-байт код, который уедет пользователю,
      # и официальные плагины молча перестанут работать на хостах без изолятора.
      - name: trust seed matches registry pins
        run: go run ./internal/plugin/cmd/genseed -check
      - name: sandbox isolation (verbose)
        run: go test ./internal/plugin/ -count=1 -v -run 'Sandbox|Untrusted|Trust'
      # На GitHub Linux-раннерах user namespaces запрещены, поэтому bwrap всегда
      # уходит в fail-closed ветку и поведение песочницы не проверяется. В контейнере
      # с privileged userns bwrap работает по-настоящему.
      - name: sandbox isolation in container (userns)
        run: |
          go test -c -o "$RUNNER_TEMP/plugin.test" ./internal/plugin/
          docker run --rm --privileged \
            -v "$RUNNER_TEMP/plugin.test:/plugin.test" \
            python:3.12-slim bash -c '
              apt-get update -qq && apt-get install -y -qq --no-install-recommends bubblewrap >/dev/null &&
              /plugin.test -test.run "Sandbox|Untrusted|Trust" -test.v'
      # Единая точка проверки: fmt, vet, lint, mod, versions, errcodes,
      # schemas, supply, build, test, conformance, mcp, pipelines, plugins,
      # registry. Локально это ровно та же команда (`fidespipe check`), поэтому
      # расхождение между CI и разработчиком невозможно по построению, а не по
      # договорённости.
      #
      # ВАЖНО: шаг стоит ПОСЛЕ установки bubblewrap и sandbox-тестов. Если
      # поднять его выше, `go test ./...` пройдёт без изолятора, и sandbox-тесты
      # начнут SKIP вместо PASS — покрытие молча уедет вниз, и никто этого
      # не заметит по зелёной галке.
      # staticcheck нужен шагу lint внутри fidespipe check, и шаг этот fail-closed:
      # без линтера в PATH проверка падает, а не молча проходит без него.
      - name: staticcheck (шаг lint в fidespipe check)
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Доноры, чьи конформные тесты запускают НАСТОЯЩИЙ инструмент, а не мок.
      # Список не «кажется правильным», а измерен: каждый плагин здесь упал бы
      # в чистом интерпретаторе — прогон `fidespipe plugin test` в venv без
      # наследования site-packages даёт 6/19 altdns, 16/23 pyelftools, 17/24
      # lief, 19/27 msoffcrypto_tool, 20/25 oletools, 13/15 dirsearch, 12/16
      # detect_secrets, 24/31 pefile. Остальные плагины с непустым
      # runtime.requires (exifread, holehe, maigret, syntax_mx_checker)
      # проходят без донора — их живые кейсы донора не касаются, и ставить его
      # здесь незачем.
      #
      # Пин берётся ИЗ requirements.lock плагина, а не пишется руками в этом
      # файле: объявление в runtime.requires и lock обязаны совпадать (контракт
      # валидатора), и второй список пинов в CI расходился бы с первым при
      # первом же перепине. dirsearch раньше стоял здесь голой строкой
      # `pip install dirsearch==0.5.0` — только потому, что плагин объявлял
      # «ставится отдельно» (runtime.requires: []) и lock'а не было; теперь
      # он объявляет пином, и строка ушла в общий список.
      #
      # Молча пропустить любой из них нельзя: «зелёный» CI будет означать
      # «донор не установлен, живые кейсы не проверялись».
      - name: plugin regression tests
        run: |
          for p in ssl_info detect_secrets dirsearch pefile altdns pyelftools lief msoffcrypto_tool oletools; do
            python3 -m pip install --disable-pip-version-check -r "plugins/community/$p/requirements.lock"
          done
          python3 -m unittest discover -s tests/plugins -v
      - name: fidespipe check (fmt, vet, lint, mod, versions, errcodes, schemas, supply, build, test, conformance, mcp, pipelines, plugins, registry)
        run: go run ./cmd/fidespipe check --race --timeout=720
      # Артефакты развёртывания проверяются ТУТ ЖЕ, а не «когда-нибудь
      # вручную». Dockerfile и юниты systemd на машине разработчика не
      # проверяются: Docker есть не везде, systemd — только на Linux. Без
      # этих шагов они тихо сгнивают: сломанный Dockerfile и юнит с
      # опечаткой выглядят ровно как рабочие, пока кто-нибудь не
      # попытается поставить.
      - name: deployment artifacts (image builds, units verified)
        run: |
          set -euo pipefail
          # Юниты: проверяется синтаксис и директивы. Бинаря по пути юнита на
          # раннере нет, поэтому подставляется заглушка: без неё systemd
          # ругается на отсутствующий исполняемый файл, а это не ошибка
          # самого юнита. Пользователь и каталоги тоже нужны реальные: иначе
          # systemd-analyze не считает юнит валидным.
          sudo ln -sf /bin/true /usr/local/bin/fidespipe
          sudo useradd --system --home-dir /var/lib/fidespipe --shell /usr/sbin/nologin fidespipe || true
          sudo mkdir -p /var/lib/fidespipe /etc/fidespipe
          for unit in deploy/systemd/*.service; do
            echo "== $unit"
            systemd-analyze verify "$unit"
          done
          # Образ: собираются обе цели — рантайм и консоль. Сборка проверяет
          # Dockerfile по-настоящему, а не «файл существует».
          docker build -t fidespipe:ci .
          docker build -t fidespipe:ci-gui --target gui .
          # Внутри образа должно быть всё, без чего недоверенный плагин не
          # запустится: bubblewrap (изоляция) и python (плагины).
          # --entrypoint обязателен: в образе ENTRYPOINT — сам fidespipe.
          docker run --rm --entrypoint sh fidespipe:ci -c 'command -v bwrap && command -v python3'
      - name: build legacy tool
        run: go build -o tool ./cmd/tool
      - name: build fidespipe
        run: go build -o fidespipe ./cmd/fidespipe
      - name: plugin list + search
        run: |
          ./fidespipe plugin list
          ./fidespipe plugin search csv
          ./fidespipe plugin search llm
      # Ловит класс «установлено нечитаемое»: install нормализует пресет через
      # yaml.Marshal, и вывод маршалинга один раз разошёлся с парсером так,
      # что `pipeline install` печатал «пресет готов», а следующий же
      # `pipeline validate` падал («when: path обязателен»,
      # «cannot unmarshal !!map into string»). Шаг pipelines проверяет
      # examples/ репозитория (написаны руками, валидны), а registry смотрит
      # манифесты плагинов — ни один из них не смотрит на байты, которые
      # install реально записал.
      #
      # Пресеты выбраны не случайно: when_demo — единственный с when (терялся
      # пустой блок when), email_check — с timeout (терялся timeout:
      # {duration: 10s}). Класс ловится любым из двух; все 12 не берутся,
      # потому что шаг должен остаться в пределах секунды.
      #
      # Реестр собирается на месте, а не берётся из registry.yaml: там source
      # указывает на удалённый git с commit-пином, и шаг ушёл бы в clone вместо
      # проверки. Здесь source — этот же checkout, шаг офлайновый. Плагины
      # копируются ровно те, что нужны двум пресетам (остальные — работа шага
      # plugins), чтобы шаг не зависел от всех 99 манифестов и не ушёл в сеть.
      - name: preset install → validate (installed bytes must read back)
        run: |
          set -eu
          work=$(mktemp -d)
          printf 'version: "0.1"\npresets:\n  when_demo:\n    source: %s\n    path: examples/when_demo.yaml\n  email_check:\n    source: %s\n    path: examples/email_check.yaml\n' "$PWD" "$PWD" > "$work/registry.yaml"
          mkdir -p "$work/plugins/community" "$work/plugins/official"
          cp -r plugins/community/text_analyzer plugins/community/word_freq "$work/plugins/community/"
          cp -r plugins/official/syntax_mx_checker plugins/official/disposable_checker "$work/plugins/official/"
          # install пишет в examples/ относительно CWD — работаем в отдельном
          # каталоге, чтобы не переписывать примеры самого checkout.
          cd "$work"
          for p in when_demo email_check; do
            "$GITHUB_WORKSPACE/fidespipe" pipeline install "$p" --registry=registry.yaml
            "$GITHUB_WORKSPACE/fidespipe" pipeline validate "examples/$p.yaml"
          done
      - name: v0.20 control flow live (when, foreach-step, parallel)
        run: |
          ./fidespipe pipeline run examples/when_demo.yaml --yes
          ./fidespipe pipeline run examples/foreach_step_demo.yaml --yes
          ./fidespipe pipeline run examples/parallel_demo.yaml --yes
      - name: v0.22 GUI API live (health + in-process run)
        run: |
          ./fidespipe gui --listen 127.0.0.1:8917 >/tmp/gui.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf 127.0.0.1:8917/api/health >/dev/null && break; sleep 0.5; done
          curl -sf 127.0.0.1:8917/api/health | grep '"status":"ok"'
          # H4: без сессии человека закрыто ВСЁ под /api/*, включая чтение
          curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:8917/api/runs | grep 401
          curl -s -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:8917/api/run -H 'Content-Type: application/json' -d '{"file":"when_demo.yaml","yes":true}' | grep 401
          # чужой Host (DNS-rebinding) — 403 даже без cookie
          curl -s -o /dev/null -w '%{http_code}' 127.0.0.1:8917/api/health -H 'Host: evil.example' | grep 403
          # не-loopback без явного флага — отказ с внятным текстом
          ./fidespipe gui --listen 0.0.0.0:8917 2>&1 | grep -q 'allow-remote'
          # вход по одноразовому коду из терминала → cookie
          CODE=$(grep -oE '[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}' /tmp/gui.log | head -1)
          test -n "$CODE"
          curl -sf -o /dev/null -c /tmp/cj17 -X POST 127.0.0.1:8917/api/session -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\"}"
          # код одноразовый: повторно не войти
          curl -s -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:8917/api/session -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\"}" | grep 401
          curl -sf -b /tmp/cj17 127.0.0.1:8917/api/runs | grep -E 'status|^\[\]$'
          curl -sf -b /tmp/cj17 -X POST 127.0.0.1:8917/api/run -H 'Content-Type: application/json' -d '{"file":"when_demo.yaml","yes":true}' | grep started
          sleep 4
          curl -sf -b /tmp/cj17 127.0.0.1:8917/api/runs | grep when_demo
          kill $GUI_PID 2>/dev/null || true
          tail -n 5 /tmp/gui.log
      - name: v0.24 browser gate live (wait → decision via API)
        run: |
          ./fidespipe gui --listen 127.0.0.1:8918 >/tmp/gui-gate.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf 127.0.0.1:8918/api/health >/dev/null && break; sleep 0.5; done
          CODE=$(grep -oE '[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}' /tmp/gui-gate.log | head -1)
          test -n "$CODE"
          curl -sf -o /dev/null -c /tmp/cj18 -X POST 127.0.0.1:8918/api/session -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\"}"
          RUN_ID=$(curl -sf -b /tmp/cj18 -X POST 127.0.0.1:8918/api/run -H 'Content-Type: application/json' -d '{"file":"gate_demo.yaml","yes":false}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["run"])')
          echo "run: $RUN_ID"
          for i in $(seq 1 40); do
            curl -sf -b /tmp/cj18 "127.0.0.1:8918/api/runs/$RUN_ID/gate" | grep '"pending":true' && break
            sleep 0.5
          done
          curl -sf -b /tmp/cj18 "127.0.0.1:8918/api/runs/$RUN_ID/gate" | grep '"pending":true'
          # агент без cookie не может ни прочитать гейт, ни одобрить
          curl -s -o /dev/null -w '%{http_code}' "127.0.0.1:8918/api/runs/$RUN_ID/gate" | grep 401
          curl -s -o /dev/null -w '%{http_code}' -X POST "127.0.0.1:8918/api/runs/$RUN_ID/gate" -H 'Content-Type: application/json' -d '{"action":"accept"}' | grep 401
          curl -sf -b /tmp/cj18 -X POST 127.0.0.1:8918/api/runs/$RUN_ID/gate -H 'Content-Type: application/json' -d '{"action":"accept"}' | grep queued
          # повторный submit — 409
          curl -s -b /tmp/cj18 -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:8918/api/runs/$RUN_ID/gate -H 'Content-Type: application/json' -d '{"action":"reject"}' | grep 409
          for i in $(seq 1 40); do
            curl -sf -b /tmp/cj18 "127.0.0.1:8918/api/runs/$RUN_ID/journal?since=0" | grep '"gate_decision"' && break
            sleep 0.5
          done
          curl -sf -b /tmp/cj18 "127.0.0.1:8918/api/runs/$RUN_ID/journal?since=0" | grep '"gate_decision"'
          curl -sf -b /tmp/cj18 "127.0.0.1:8918/api/runs/$RUN_ID/journal?since=0" | grep '"action":"accept"'
          curl -sf -b /tmp/cj18 "127.0.0.1:8918/api/runs/$RUN_ID/journal?since=0" | grep '"source":"gui"'
          ! grep -rq "$CODE" var/runs examples 2>/dev/null  # код и токен не в журналах
          kill $GUI_PID 2>/dev/null || true
          tail -n 5 /tmp/gui-gate.log
      - name: v0.25 editor live (parse/serialize round-trip)
        run: |
          node --check web/static/editor/app.js
          node --check web/static/app.js
          ./fidespipe gui --listen 127.0.0.1:8919 >/tmp/gui-ed.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8919/api/health >/dev/null && break; sleep 0.5; done
          CODE=$(grep -oE '[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}' /tmp/gui-ed.log | head -1)
          test -n "$CODE"
          curl -sf -o /dev/null -c /tmp/cj19 -X POST localhost:8919/api/session -H 'Content-Type: application/json' -d "{\"code\":\"$CODE\"}"
          # страница и редактор живы без сессии (одностраничный сценарий)
          curl -sf localhost:8919/editor/ | grep "редактор"
          curl -sf localhost:8919/ | grep "Fidespipe"
          # без cookie редакторские /api/* закрыты
          curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8919/api/parse/pipeline --data-binary @examples/gate_demo.yaml | grep 401
          ed() { curl -sf -b /tmp/cj19 "$@"; }
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/gate_demo.yaml | grep '"name":"gate_demo"'
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/single_check.yaml | grep '"plugin":"core/human_gate"'
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/when_demo.yaml | grep '"when":{"path":"steps.stats.words","op":"gte","value":10}'
          # Round-trip по-настоящему: parse(serialize(doc)) == doc, а не только
          # ok:true. Шаг выше ждал только «успех» от serialize и результат
          # обратно не читал — ровно этим способом класс «маршалинг несимметричен
          # парсингу» доехал до релиза незамеченным. Сравнение строгое: без
          # нормализации, поле в поле, включая when/timeout/retry/bind/form.
          # Несущественность проверена: если serialize начать терять timeout
          # шага, single_check даёт «.steps[0].timeout: '10s' != ''» и шаг падает.
          cat > /tmp/rt_diff.py <<'PY'
          import json, sys
          def diff(a, b, path=""):
              if type(a) is not type(b):
                  return ["%s: %r != %r" % (path or "/", a, b)]
              if isinstance(a, dict):
                  out = []
                  for k in sorted(set(a) | set(b)):
                      if k not in a or k not in b:
                          out.append("%s.%s: есть только с одной стороны" % (path, k))
                      else:
                          out += diff(a[k], b[k], "%s.%s" % (path, k))
                  return out
              if isinstance(a, list):
                  if len(a) != len(b):
                      return ["%s: длина %d != %d" % (path or "/", len(a), len(b))]
                  out = []
                  for i, (x, y) in enumerate(zip(a, b)):
                      out += diff(x, y, "%s[%d]" % (path, i))
                  return out
              return [] if a == b else ["%s: %r != %r" % (path or "/", a, b)]
          name, before, after = sys.argv[1], sys.argv[2], sys.argv[3]
          d = diff(json.load(open(before)), json.load(open(after)))
          if d:
              sys.exit("%s: parse(serialize(doc)) != doc:\n  %s" % (name, "\n  ".join(d)))
          print("round-trip ok: " + name)
          PY
          rt() {
            ed -X POST localhost:8919/api/parse/pipeline --data-binary @"$1" > /tmp/rt_before.json
            ed -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' --data-binary @/tmp/rt_before.json > /tmp/rt_ser.json
            grep -q '"ok":true' /tmp/rt_ser.json || { echo "serialize ok=false: $1"; cat /tmp/rt_ser.json; exit 1; }
            python3 -c 'import json,sys; sys.stdout.write(json.load(open("/tmp/rt_ser.json"))["yaml"])' > /tmp/rt.yaml
            ed -X POST localhost:8919/api/parse/pipeline --data-binary @/tmp/rt.yaml > /tmp/rt_after.json
            python3 /tmp/rt_diff.py "$1" /tmp/rt_before.json /tmp/rt_after.json || exit 1
          }
          rt examples/gate_demo.yaml
          rt examples/single_check.yaml
          rt examples/when_demo.yaml
          rt examples/csv_foreach_summary.yaml
          ed -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"when_ci","input":[],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","when":{"path":"input.x","op":"truthy"},"form":[],"actions":["accept"],"on_reject":"stop","unsupported":[]}]}' | grep '"ok":true'
          ed -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"when_ci2","input":[],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","when":{"path":"input.x","op":"gt","value":"15"},"form":[],"actions":["accept"],"on_reject":"stop","unsupported":[]}]}' | grep 'value: 15'
          ed -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"when_ci3","input":[],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","when":{"path":"input.x","op":"bogo"},"form":[],"actions":["accept"],"on_reject":"stop","unsupported":[]}]}' | grep '"ok":false'
          echo "when editor: live checks ok"
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/foreach_step_demo.yaml | grep '"foreach":"input.texts"'
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/parallel_demo.yaml | grep '"parallel_group":"analyze"'
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/csv_foreach_summary.yaml | grep '"after_foreach":true'
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/csv_foreach_summary.yaml | grep '"foreach":"steps.load.rows"'
          echo "flow editor: live checks ok"
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/llm_same_provider.yaml | grep '"secrets":\["GEMINI_API_KEY"\]'
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/llm_same_provider.yaml | grep '"retry":{"attempts":3,"delay":"2s","backoff":"exponential"}'
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/llm_same_provider.yaml | grep '"on_error":"retry"'
          ed -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"retry_ci","input":[],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"retry","bind":{},"form":[],"actions":["accept"],"on_reject":"","retry":{"attempts":0,"delay":"1s","backoff":"fixed"},"unsupported":[]}]}' | grep '"ok":false'
          echo "retry editor: live checks ok"
          ed -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"secrets_ci","input":[],"secrets":["CI_KEY_XYZ"],"steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","bind":{},"form":[],"actions":["accept"],"on_reject":"","unsupported":[]}]}' | grep "secrets:"
          echo "secrets editor: live checks ok"
          ed -X POST localhost:8919/api/parse/pipeline --data-binary @examples/text_stats.yaml | grep '"network":"deny"'
          ed -X POST localhost:8919/api/serialize/pipeline -H 'Content-Type: application/json' -d '{"name":"net_ci","input":[],"network":"deny","steps":[{"id":"g","plugin":"core/human_gate","pos":[0,0],"on_error":"stop","bind":{},"form":[],"actions":["accept"],"on_reject":"","unsupported":[]}]}' | grep "network: deny"
          ed localhost:8919/api/plugins | grep '"any_host":true'
          echo "network editor: live checks ok"
          kill $GUI_PID 2>/dev/null || true
          tail -n 3 /tmp/gui-ed.log
      - name: v0.7 standalone binary (embedded GUI, no repo)
        run: |
          mkdir -p /tmp/fidespipe-standalone
          cp ./fidespipe /tmp/fidespipe-standalone/
          cd /tmp/fidespipe-standalone
          ./fidespipe gui --listen 127.0.0.1:8920 >/tmp/gui-embed.log 2>&1 &
          GUI_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8920/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:8920/ | grep "Fidespipe"
          curl -sf localhost:8920/editor/ | grep "редактор"
          curl -sf localhost:8920/editor/app.js | grep "pluginNetworkHint"
          curl -sf localhost:8920/app.js | grep "api/health"
          kill $GUI_PID 2>/dev/null || true
          tail -n 3 /tmp/gui-embed.log
      - name: v0.8 desktop exe (fidespipegui) — cross-builds + PE check
        run: |
          go build -o /tmp/fidespipegui-linux ./cmd/fidespipegui
          GOOS=windows GOARCH=amd64 go build -o /tmp/fidespipegui-win-amd64.exe ./cmd/fidespipegui
          GOOS=windows GOARCH=arm64 go build -o /tmp/fidespipegui-win-arm64.exe ./cmd/fidespipegui
          GOOS=darwin GOARCH=amd64 go build -o /tmp/fidespipegui-darwin ./cmd/fidespipegui
          head -c2 /tmp/fidespipegui-win-amd64.exe | grep MZ
      - name: v0.8 desktop live (embedded GUI, clean dir)
        run: |
          mkdir -p /tmp/fidespipegui-live && cd /tmp/fidespipegui-live
          /tmp/fidespipegui-linux --port 8921 >/tmp/fidespipegui.log 2>&1 &
          WG_PID=$!
          for i in $(seq 1 20); do curl -sf localhost:8921/api/health >/dev/null && break; sleep 0.5; done
          curl -sf localhost:8921/ | grep "Fidespipe"
          curl -sf localhost:8921/editor/ | grep "редактор"
          grep -q "Fidespipe desktop" /tmp/fidespipegui.log
          kill -TERM $WG_PID
          sleep 1
          pgrep -x fidespipegui-linux >/dev/null && exit 1 || true
      - name: v0.9 agent track (validate --json, conformance, MCP)
        run: |
          ./fidespipe pipeline validate examples/email_triage_chain.yaml --json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"], d'
          printf 'format_version: "0.2"\npipeline:\n  name: bad\n  input: {text: x}\n  steps:\n    - {id: a, plugin: plugins/community/text_analyzer, bind: {text: input.nope}}\n' > /tmp/bad.yaml
          ! ./fidespipe pipeline validate /tmp/bad.yaml --json > /tmp/bad.json
          grep -q E_PORT_SOURCE /tmp/bad.json
          ./fidespipe plugin test internal/core/testdata/plugins --conformance
          # contract_input роняет элемент, не ран (exit 1 = были aborted — ожидаемо)
          (./fidespipe pipeline run examples/email_triage_chain.yaml --yes || true) | grep 'ok=3 aborted=1'
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | ./fidespipe mcp --plugins "$PWD/plugins" --workdir "$PWD" --no-gui 2>/dev/null > /tmp/mcp.out
          grep -q '"version":"'"$(cat VERSION)"'"' /tmp/mcp.out
          grep -q cancel_run /tmp/mcp.out
      - name: foreach + after_foreach live
        run: |
          ./fidespipe pipeline run examples/csv_foreach.yaml --yes
          ./fidespipe pipeline run examples/csv_foreach_summary.yaml --yes
      - name: resume live
        run: |
          ./fidespipe pipeline run examples/csv_foreach.yaml --yes --runs-dir=var/runs | tail
          last=$(ls -t var/runs | head -1)
          echo "resume $last"
          ./fidespipe runs show $last
          ./fidespipe runs list
      - name: json store live
        run: |
          ./fidespipe pipeline run examples/csv_foreach_summary.yaml --yes --store=json --db-path=var/runs/runs.db
          ./fidespipe runs list --store=json --db-path=var/runs/runs.db
          last=$(./fidespipe runs list --store=json --db-path=var/runs/runs.db | grep -oE '[0-9]{8}-[0-9]{6}-[a-z0-9_-]+' | head -1)
          echo "json run $last"
          ./fidespipe runs show $last --store=json --db-path=var/runs/runs.db
      - name: schemas check
        run: |
          ls schemas/
          ls protocol/ protocol/v0.2/
          cat schemas/pipeline.v0.2.schema.json | head -n 20

  # Заявленный минимум Go обязан быть РЕАЛЬНО собираемым, а не написанным в
  # README. Директива `go` в go.mod — это и есть минимум: инструментарий старее
  # неё отказывается собирать модуль вообще, поэтому «Go 1.26+» перестаёт быть
  # обещанием. Джоб ставит ровно ту версию, что в директиве, и проверяет, что
  # она не старше установленной — иначе setup-go молча поднял бы версию, и
  # проверка снова стала бы вакуумно-зелёной.
  #
  # Именно поэтому «поднять директиву» безопаснее, чем «честно описать»: при
  # 1.22 в go.mod (EOL) CI собирал 1.26.x, и расхождение было невидимым.
  go-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история нужна проверке доверия: TestGeneratedSeedMatchesRegistryPins
          # разворачивает запиненные коммиты через git archive, и в мелком клоне
          # их нет («not a tree object»). Ослаблять проверку скипом нельзя: тогда
          # она начнёт молча ничего не проверять.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10' # GO-2026-6809: crypto/x509, чинится в 1.26.10
      - name: floor == go.mod directive
        run: |
          set -eu
          floor=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)
          test -n "$floor" || { echo "в go.mod нет директивы go"; exit 1; }
          toolchain=$(go env GOVERSION)
          toolchain=${toolchain#go}
          printf 'go.mod floor=%s toolchain=%s\n' "$floor" "$toolchain"
          oldest=$(printf '%s\n%s\n' "$floor" "$toolchain" | sort -V | head -1)
          test "$oldest" = "$floor" || { echo "сборка идёт не на заявленном минимуме"; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./internal/verdoc/ ./internal/journal/ ./internal/registry/ -count=1

  windows:
    runs-on: windows-latest
    # Инвариант: бюджет ДЖОБА заметно больше бюджета ШАГА. Обратный порядок
    # отменяет джоб раньше шага, и тогда лог шага не выгружается вовсе
    # (проверено: BlobNotFound у отменённого джоба). Джоб (30) заметно больше
    # шага (25): шаги vet, сборки и выгрузка тоже живут внутри бюджета джоба,
    # и отмена джоба раньше шага снова спрятала бы лог.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история нужна проверке доверия: TestGeneratedSeedMatchesRegistryPins
          # разворачивает запиненные коммиты через git archive, и в мелком клоне
          # их нет («not a tree object»). Ослаблять проверку скипом нельзя: тогда
          # она начнёт молча ничего не проверять.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10' # GO-2026-6809: crypto/x509, чинится в 1.26.10
      # Дедлайн есть у каждого шага: если шаг встанет, джоб отменится, а лог
      # отменённого джоба не отдаётся (BlobNotFound) — терять его незачем.
      - run: go vet ./...
        timeout-minutes: 5
      # Проба AppContainer живёт под тегом appcontainer. Без этого шага она в CI
      # не компилируется вообще — ни красным, ни зелёным, а просто молча
      # остаётся мёртвым текстом, который завтра перестанет собираться и об
      # этом не скажет. Тега достаточно для проверки сборки: сам замер на
      # раннере запускать незачем, ему нужен настоящий интерпретатор Python под
      # %LOCALAPPDATA%\Python\pythoncore-*, которого на раннере нет, и без него
      # проба всё равно была бы скипом.
      - run: go vet -tags appcontainer ./internal/plugin/
        timeout-minutes: 5
      # Windows-джоб: у шага есть дедлайн, захват вывода идёт ТОЛЬКО в файлы, а
      # вокруг каждого пакета снимается таблица процессов. Разбор механизма, все
      # проверенные факты и то, что заведомо НЕ является причиной, — в
      # docs/windows-ci-hang.md. Кратко:
      #  * никаких пайпов между нами и `go`: Process.WaitForExit() без аргумента
      #    ждёт EOF перенаправленных пайпов, и потомок может заблокировать шаг уже
      #    ПОСЛЕ того, как всё отработало (ветка с уликами тогда не наступает);
      #  * `go list ./...` больше не без дедлайна (если он встанет, в summary не
      #    было ни одной строки — теперь это названо явно);
      #  * DETACHED/SURVIVOR в summary отвечает на вопрос «какой процесс переживает
      #    тест» на любом прогоне, включая зелёный; найденные оторванные потомки
      #    убиваются, чтобы не держать пайпы раннера и не терять лог шага.
      #
      # Пределы заданы по замерам, а не «на глаз». По пакетам на Windows:
      #
      #   internal/core    272 с локально, 210 с в CI   <- самый долгий
      #   internal/plugin  110 с локально, 122 с в CI
      #   остальные 20     <=19 с
      #   сумма всех 22    ~470 с
      #
      # GoTimeoutSec — это `go test -timeout`, и именно он даёт дамп горутин,
      # поэтому PerPackageSec держится ВЫШЕ него: сначала должен отработать
      # go test, внешний предел — только страховка. Исчерпание BudgetSec
      # даёт BUDGET-SKIP и exit 1 (windows-test-guard.ps1:415), то есть
      # непроверенный пакет падает явно, а не зелёным молчанием.
      #
      # GoTimeoutSec = 480, а не 360: запас над core (272 с) должен пережить
      # медленный раннер, иначе пакет снова убьётся сторожем и это будет
      # выглядеть как старая поломка, а не как новая.
      - name: go test (per package, with orphan census)
        shell: pwsh
        timeout-minutes: 25
        run: ./tools/ci/run-guard-with-watchdog.ps1 -BudgetSec 1200 -PerPackageSec 540 -GoTimeoutSec 480 -KillLeakedDescendants

      # Диагностика должна пережить отмену джоба.
      - name: upload per-package logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-gotest-logs
          path: ${{ runner.temp }}/gotest/
          retention-days: 7
          if-no-files-found: ignore
      - run: go build ./cmd/fidespipe
      - run: go build ./cmd/fidespipegui

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история нужна проверке доверия: TestGeneratedSeedMatchesRegistryPins
          # разворачивает запиненные коммиты через git archive, и в мелком клоне
          # их нет («not a tree object»). Ослаблять проверку скипом нельзя: тогда
          # она начнёт молча ничего не проверять.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10' # GO-2026-6809: crypto/x509, чинится в 1.26.10
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 10m
      - name: sandbox isolation (verbose)
        run: go test ./internal/plugin/ -count=1 -v -run 'Sandbox|Untrusted|Trust'
      - run: go test ./internal/core -run TestConformance -count=1
      - run: go build ./cmd/fidespipe
      - run: go build ./cmd/fidespipegui

  # v0.17: trust-гейт релиза — на теге реестр проверяется по РЕАЛЬНЫМ пинам
  # (клоны git по version из registry.yaml), без local-source.
  registry-release:
    needs: core
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история нужна проверке доверия: TestGeneratedSeedMatchesRegistryPins
          # разворачивает запиненные коммиты через git archive, и в мелком клоне
          # их нет («not a tree object»). Ослаблять проверку скипом нельзя: тогда
          # она начнёт молча ничего не проверять.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10' # GO-2026-6809: crypto/x509, чинится в 1.26.10
      - run: go build -o fidespipe ./cmd/fidespipe
      # Тот же список доноров, что и в джобе core, и по той же причине:
      # `registry validate` гоняет plugin.test.yaml КАЖДОЙ записи реестра
      # (internal/cli/registry.go, RunPluginTests вызывается безусловно — не
      # только для --local-source), а живые кейсы этих восьми плагинов
      # запускают настоящего донора. Без установки релизный гейт краснеет
      # на 53 кейсах (altdns 13, msoffcrypto_tool 8, pyelftools 7, lief 7,
      # pefile 7, oletools 5, detect_secrets 4, dirsearch 2). Список и замеры —
      # в комментарии шага джоба core.
      - name: install donor packages for plugin tests
        run: |
          for p in ssl_info detect_secrets dirsearch pefile altdns pyelftools lief msoffcrypto_tool oletools; do
            python3 -m pip install --disable-pip-version-check -r "plugins/community/$p/requirements.lock"
          done
      - run: ./fidespipe registry validate --registry=registry.yaml

  release:
    needs: [core, go-floor, windows, macos, registry-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
