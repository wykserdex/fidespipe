# Каждый одобренный release tag = GitHub Release с бинарниками и conformance asset.
# Это то, что получают пользователи: скачать и запустить без Go.
name: release
on:
  workflow_call:

permissions:
  contents: write
  # id-token — не «на всякий случай»: без него не работают ни keyless-подпись
  # (cosign берёт OIDC-токен раннера), ни attest-build-provenance. Вызывающий
  # джоб в ci.yml выдаёт те же права, и понизить их здесь нельзя.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Полная история нужна проверке доверия: засев строится из пинов
          # реестра, а запиненных коммитов в мелком клоне нет
          # («not a tree object»). Проверено локальным клоном --depth 1.
          # Ослаблять проверку скипом нельзя — пропуск неотличим от успеха.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # См. обоснование в ci.yml: GO-2026-6617 чинится в go1.26.9.
          go-version: '1.26.9'
      - name: release version check
        run: |
          set -eu
          file_version=$(tr -d '\r\n' < VERSION)
          # SemVer, а не буквенный суффикс: Go принимает как версию модуля только
          # SemVer, поэтому тег вроде v0.33c закрывал `go install` молча — тег
          # существует на GitHub и «не существует» для тулинга.
          printf '%s' "$file_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$' \
            || { echo "VERSION=$file_version не SemVer: нужен вид X.Y.Z" >&2; exit 1; }
          test "${GITHUB_REF_NAME#v}" = "$file_version"
      - name: dependency integrity
        run: go mod verify
      - name: vulnerability scan
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: static checks
        run: |
          go vet ./...
          test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
      - name: tests
        run: go test ./... -count=1
      - name: registry pin validation
        run: go run ./cmd/fidespipe registry validate --registry=registry.yaml
      - name: conformance
        run: go test ./internal/core -run TestConformance -count=1
      - name: build all platforms
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X github.com/wykserdex/fidespipe/internal/buildinfo.Version=${VER}"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              [ "$os" = "windows" ] && ext=".exe"
              echo "== $os/$arch (Version=$VER)"
              GOOS=$os GOARCH=$arch go build -ldflags="$LDFLAGS" -o "dist/fidespipe-${os}-${arch}${ext}" ./cmd/fidespipe
              GOOS=$os GOARCH=$arch go build -ldflags="$LDFLAGS" -o "dist/tool-${os}-${arch}${ext}" ./cmd/tool
            done
          done
          # v0.8: desktop-exe (Windows: окно WebView2, чистый Go)
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch go build -ldflags="$LDFLAGS" -o "dist/fidespipegui-windows-${arch}.exe" ./cmd/fidespipegui
          done
          mkdir -p dist/conformance-package/conformance/fixtures
          cp conformance/README.md conformance/manifest.json dist/conformance-package/conformance/
          cp -R conformance/fixtures/v0.2 dist/conformance-package/conformance/fixtures/
          (cd dist/conformance-package && zip -qr "../fidespipe-conformance-v${VER}.zip" .)
          smoke_dir=$(mktemp -d)
          unzip -q "dist/fidespipe-conformance-v${VER}.zip" -d "$smoke_dir"
          ./dist/fidespipe-linux-amd64 plugin test --conformance --fixtures="$smoke_dir/conformance/fixtures/v0.2" --json
          rm -rf "$smoke_dir" dist/conformance-package
      - name: generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: checksums
        run: sha256sum dist/fidespipe-* dist/tool-* dist/fidespipegui-* dist/sbom.spdx.json > dist/SHA256SUMS
      # Подпись без единого секрета. cosign берёт OIDC-токен раннера
      # (`id-token: write` в permissions этого джоба — он и был нужен для
      # attest-build-provenance), Fulcio выдаёт на него короткоживущий
      # сертификат, Rekor пишет запись. Ключа в репозитории нет, секретов не
      # требуется, от стороннего контрибьютора ничего не зависит: релиз
      # подписывается тем токеном, который раннер и так получает по правам
      # джоба.
      #
      # Версия cosign закреплена ЯВНО, а не дефолтом инсталлера: дефолт
      # cosign-installer v4.1.2 — v3.0.6, а в v3.1.3 приходит фикс
      # GHSA-fx35-mq7g-6g98 (обход проверки подписи через чужой ключ в
      # legacy-бандле). Проверять подпись уязвимой версией cosign — значит
      # не проверять её вовсе. Следствие: обновление cosign теперь требует
      # правки этой строки, и это сделано намеренно.
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      # Подписываются ровно два файла: SHA256SUMS (а через него — все
      # бинарники) и сам SBOM. Остальное не подписывается отдельно намеренно:
      # подпись каждого бинарника отдельно не даёт ничего, чего не даёт
      # подпись списка сумм, и только удваивает число Rekor-записей.
      - name: sign checksums and SBOM (keyless)
        run: |
          set -eu
          command -v cosign >/dev/null 2>&1 || { echo "cosign не в PATH: артефакты уедут без подписи, релиз не публикуем" >&2; exit 1; }
          cosign version
          for f in dist/SHA256SUMS dist/sbom.spdx.json; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json" --yes
          done
      # Проверка подписи в том же прогоне, а не только в документации.
      # Список файлов задан явно: «перебрать dist/*» прошло бы успехом и при
      # нуле бандлов, то есть подпись исчезла бы, а шаг остался бы зелёным.
      # Пропуск и провал здесь неотличимы — значит, шаг обязан падать.
      - name: verify signatures (fail-closed)
        env:
          SIGSTORE_ISSUER: https://token.actions.githubusercontent.com
          # Точный SAN, который Fulcio кладёт в сертификат: job_workflow_ref
          # плюс ref. Это имя файла ИСПОЛЬЗУЕМОГО воркфлоу (release.yml), а
          # не вызывающего (ci.yml), — проверено по коду
          # sigstore/fulcio pkg/identity/github/principal.go, где SAN = baseURL
          # + jobWorkflowRef.
          SIGSTORE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -eu
          command -v cosign >/dev/null 2>&1 || { echo "cosign не в PATH: подпись не проверена, релиз не публикуем" >&2; exit 1; }
          for f in dist/SHA256SUMS dist/sbom.spdx.json; do
            test -s "$f.sigstore.json" || { echo "нет бандла подписи: $f.sigstore.json" >&2; exit 1; }
            cosign verify-blob "$f" \
              --bundle "$f.sigstore.json" \
              --certificate-identity "$SIGSTORE_IDENTITY" \
              --certificate-oidc-issuer "$SIGSTORE_ISSUER"
          done
          # Конец цепочки: подпись покрывает SHA256SUMS, а значит — каждый
          # бинарник из него. Без этой строки подпись говорила бы только о
          # самом списке.
          sha256sum --check --strict dist/SHA256SUMS
      # provenance идёт ПОСЛЕ подписи, поэтому subject-path покрывает и сами
      # бандлы: «эти бандлы — те, что лежат в этом релизе».
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
