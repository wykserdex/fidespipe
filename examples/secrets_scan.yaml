format_version: "0.2"

# Пример пресета на плагине с ВНЕШНИМ донором: community/detect_secrets.
#
# Плагин запускает настоящий `detect-secrets` (пин detect-secrets==1.5.0 в
# runtime.requires), поэтому пример — это проверка всей цепочки поставки:
# манифест с типизированными портами → обёртка → конформные тесты, которые
# реально запускают инструмент → пайплайн, который его зовёт.
#
# ВНИМАНИЕ про пути: cwd subprocess плагина = ЕГО директория (PROTOCOL §1).
# "fixtures/leaky" здесь — относительно plugins/community/detect_secrets/, а не
# корня репо. Для своего проекта подставьте абсолютный путь.
#
# network: deny — плагин объявляет network: [] и сеть не трогает: сканирование
# идёт по локальным файлам (проверено запуском с заблокированными socket).
#
# Запуск:  ./fidespipe run examples/secrets_scan.yaml --yes
# Плагин из локальной правки не входит во встроенный allow-list (доверие — по
# хэшу содержимого), поэтому ран откажет и назовёт ожидаемую запись вида
# detect_secrets@sha256:... — её и вносят в конфиг оператора (FIDESPIPE_TRUST_CONFIG).

pipeline:
  name: secrets_scan
  network: deny
  input:
    path: "fixtures/leaky"

  steps:
    - id: scan
      plugin: plugins/community/detect_secrets
      bind: { path: input.path }
      on_error: stop
      timeout: 60s            # холодный старт донора (импорт detect_secrets) — секунды

    # Гейт смотрит на то, ради чего плагин и запускался: сколько находок и
    # какой версией детекторов они посчитаны. Значений секретов в выводе нет,
    # поэтому светить их в форме безопасно.
    - id: review
      plugin: core/human_gate
      form:
        - { field: steps.scan.count, editable: false }
        - { field: steps.scan.detector_version, editable: false }
        - { field: steps.scan.secrets, editable: false }
      actions: [accept, reject]
      on_reject: stop