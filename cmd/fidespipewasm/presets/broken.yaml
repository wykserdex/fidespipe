format_version: "0.2"

# Deliberately broken, and meant to be validated rather than run. input.text is
# a number where core/text_stats declares a string port, and validation reports
# it before anything executes — the point of the contract is that a broken
# chain fails here, not halfway through a run.
#
# The gate below also asks for steps.stats.does_not_exist, which the plugin
# never outputs. Validation does not flag that one: form fields are not checked
# against plugin outputs, so it is the run that comes up empty, not the linter.

pipeline:
  name: broken_contract
  network: deny

  input:
    text: 42

  steps:
    - id: stats
      plugin: core/text_stats
      on_error: stop

    - id: review
      plugin: core/human_gate
      form:
        - { field: steps.stats.does_not_exist, editable: false }
      actions: [accept]
